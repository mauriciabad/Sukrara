# Robolectric tests run on a plain Application, not Sukrara's App: App.onCreate starts process-wide background work
# (widget previews composed on Dispatchers.Default, the sensor-end re-plans, the calendar writer) that outlives its test,
# because Robolectric keeps every object for the whole JVM. Seen in CI: a widget preview composition applying a Compose
# snapshot on a worker thread made a Compose UI test recompose there (CalledFromWrongThreadException), and a stale
# sensor-end re-plan cancelled another test's notification. A test initialises what it uses itself (RobolectricAppTest).
application=android.app.Application
