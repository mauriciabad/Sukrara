[project]
name = "ogs-reference"
version = "0.1.0"
description = "Reference implementation and test vectors of the Open Glucose Stream (OGS) draft spec"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# Crypto (secp256k1/BIP-340, NIP-44, ChaCha20, HKDF, bech32) is standard-library Python on purpose: an
# independent implementation, not the rust-nostr library both reference apps use.
dependencies = ["websockets>=13"]

[project.scripts]
ogs = "ogs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ogs"]
