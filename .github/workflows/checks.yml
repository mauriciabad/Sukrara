# The repo's guards (CLAUDE.md → tools/check) plus both V1 apps' builds and tests over the shared contracts/.
# The trigger is never path-filtered (a skipped workflow leaves a required check pending forever): the `changes` job
# decides which jobs run, and `gate` is the ONLY required check: it fails unless every job that should have run passed.
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      mac: ${{ steps.filter.outputs.mac }}
      poc: ${{ steps.filter.outputs.poc }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'contracts/**'
              - 'tools/**'
              - 'VERSION'
              - 'assets/**'
            mac:
              - 'apps/macos/**'
              - 'contracts/**'
              - 'tools/**'
              - 'VERSION'
              - 'assets/**'
            poc:
              - 'poc/**'

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tools/check/run.sh over the pushed / PR range
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then RANGE="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then RANGE="$BEFORE..$HEAD_SHA"
          else RANGE="origin/main..$HEAD_SHA"; fi
          echo "range: $RANGE"
          tools/check/run.sh --range "$RANGE"
      - name: The checks' own tests
        run: tools/check/run.sh --selftest
      - name: Generated settings code is up to date
        run: python3 tools/settings/gen.py --check
      - name: Scripts parse
        run: for f in tools/*.sh tools/*/*.sh; do bash -n "$f" || exit 1; done

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Is there a V1 Android build yet?
        id: present
        run: |
          if [ -f apps/android/settings.gradle.kts ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "build=false" >> "$GITHUB_OUTPUT"; echo "apps/android has no Gradle build yet: nothing to build"; fi
      - uses: actions/setup-java@v5
        if: steps.present.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: ./gradlew check (unit + contract tests, lint, spotless, Roborazzi verify)
        if: steps.present.outputs.build == 'true'
        working-directory: apps/android
        # verifyReleaseSigning guards real release outputs and needs the owner's key; CI has none and ships no
        # release artifact, so it is excluded here (release builds are checked by tools/release/verify-apk.sh).
        run: ./gradlew --no-daemon check -x verifyReleaseSigning

  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Is there a V1 Mac package yet?
        id: present
        run: |
          if [ -f apps/macos/Package.swift ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "build=false" >> "$GITHUB_OUTPUT"; echo "apps/macos has no Swift package yet: nothing to build"; fi
      - name: swift build + swift test (contract tests over contracts/)
        if: steps.present.outputs.build == 'true'
        working-directory: apps/macos
        run: |
          swift build
          swift test
      - name: Unsigned bundle smoke (app + widget appex)
        if: steps.present.outputs.build == 'true'
        working-directory: apps/macos
        run: Bundle/bundle.sh --unsigned

  poc-android:
    needs: changes
    if: needs.changes.outputs.poc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        id: jdk21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: PoC unit tests
        working-directory: poc/spikes/showcase-android
        env:
          GALLERY_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  poc-mac:
    needs: changes
    if: needs.changes.outputs.poc == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: swift build
        working-directory: poc/spikes/menubar
        run: swift build
      - name: PoC self-tests
        working-directory: poc/spikes/menubar
        run: |
          for t in alerts-selftest graphselftest exportselftest treatmentsselftest bleselftest argsselftest identityselftest settingsselftest panelselftest; do
            .build/debug/GlucoseBar -$t || exit 1
          done

  gate:
    # The only required check. Passes only when every job either succeeded, or was skipped because `changes` said
    # its paths didn't change; a failed, cancelled or unexpectedly skipped job fails it.
    if: always()
    needs: [changes, rules, android, mac, poc-android, poc-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that should have run passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          out = needs.get("changes", {}).get("outputs", {})
          wanted = {"changes": True, "rules": True, "android": out.get("android") == "true",
                    "mac": out.get("mac") == "true", "poc-android": out.get("poc") == "true",
                    "poc-mac": out.get("poc") == "true"}
          bad = []
          for job, should in wanted.items():
              r = needs.get(job, {}).get("result")
              ok = r == "success" or (r == "skipped" and not should)
              print("%-12s %-9s %s" % (job, r, "ok" if ok else "FAILED"))
              if not ok:
                  bad.append(job)
          sys.exit(1 if bad else 0)
          PY
