# The repo's guards (CLAUDE.md → tools/check) plus the cross-platform tests: Android unit tests (alert scenarios,
# graph fixtures, strings parity) and the Mac self-tests over the same scenario / fixture files.
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tools/check/run.sh over the pushed / PR range
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then RANGE="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then RANGE="$BEFORE..$HEAD_SHA"
          else RANGE="origin/main..$HEAD_SHA"; fi
          echo "range: $RANGE"
          tools/check/run.sh --range "$RANGE"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        id: jdk21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests (alert scenarios, graph fixtures, every surface's layout and freshness, strings parity, stats; Robolectric + galleries on JDK 21)
        working-directory: spikes/showcase-android
        env:
          GALLERY_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  mac:
    # Command Line Tools only: swift build of the menubar package (no signing, no widget appex, no Keychain).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: swift build
        working-directory: spikes/menubar
        run: swift build
      - name: Type-check the widget extension and the evidence renderer (they draw the card through CardSurfaces.swift)
        working-directory: spikes/widgets-macos
        run: |
          SDK=$(xcrun --show-sdk-path --sdk macosx)
          swiftc -sdk "$SDK" -target arm64-apple-macos15.0 -swift-version 5 -typecheck -parse-as-library -application-extension -module-name GlucoseWidget Shared/*.swift Widget/GlucoseWidgets.swift
          swiftc -sdk "$SDK" -target arm64-apple-macos15.0 -swift-version 5 -typecheck -parse-as-library -module-name Render Shared/*.swift Render/RenderMain.swift
      - name: Self-tests (alert scenarios, graph math + fixtures + every surface's layout, CSV export, treatments merge, Bluetooth limits + INFO vectors)
        working-directory: spikes/menubar
        run: |
          .build/debug/GlucoseBar -alerts-selftest
          .build/debug/GlucoseBar -graphselftest
          .build/debug/GlucoseBar -exportselftest
          .build/debug/GlucoseBar -treatmentsselftest
          .build/debug/GlucoseBar -bleselftest
          .build/debug/GlucoseBar -argsselftest
          .build/debug/GlucoseBar -identityselftest
          .build/debug/GlucoseBar -settingsselftest
          .build/debug/GlucoseBar -panelselftest
      - name: Launch guard (unknown flags and dev builds never start the full app)
        working-directory: spikes/menubar
        run: |
          set +e
          for args in "-nosuchselftest" "-nosuchflag" ""; do
            perl -e 'alarm 30; exec @ARGV' .build/debug/GlucoseBar $args; rc=$?
            echo "GlucoseBar '$args' → exit $rc"
            if [ $rc -ne 2 ] && [ $rc -ne 3 ]; then echo "expected exit 2 or 3"; exit 1; fi
          done
