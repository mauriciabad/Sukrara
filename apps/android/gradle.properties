org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
# several agents build in parallel on a 16 GB Mac: keep each build small
org.gradle.workers.max=3
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# JDK 21 is required (Robolectric, Roborazzi). No auto-download: without JDK 21 the build fails with Gradle's
# "No matching toolchains found" error; install it with `brew install openjdk@21` (docs/DEVELOPMENT.md). Homebrew's
# keg isn't a place Gradle scans, so it is listed here (ignored when absent; CI's setup-java sets JAVA_HOME).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
